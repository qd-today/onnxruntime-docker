name: _Image (reusable)

# onnxruntime 双出口流水线：每个平台同时产出 **wheelhouse 镜像** 与 **runtime 镜像**，
# 逐平台冒烟，全绿且平台集合完整才分别合并两套 manifest 发布。
#
# Dockerfile 的两个出口 stage：
#   * `--target wheel`   → `FROM scratch` + `/wheels`（onnxruntime + numpy 两个 wheel
#                          与 SHA256SUMS）。镜像本身就是 wheel 的载体：按 digest 推送，
#                          使用者 `docker create` + `docker cp` 即可取出同一份字节。
#   * `--target runtime` → 可直接运行的镜像（python3 + uv + 已装好的 onnxruntime/numpy，
#                          里面**没有** /wheels）。这是使用者 `FROM` 的基座。
#
# 阶段划分（与 pycurl-docker / ddddocr 一致的四段解耦）：
#   1) plan   ：算出构建分组、冒烟矩阵、平台全集与「是否全量」，下游只吃 outputs
#   2) build  ：每个平台一个 job，一次编译两个出口（repack 阶段共享，不重复编译）；
#               发布模式两个出口各自 push-by-digest（不产任何中间 tag）
#   3) smoke  ：每个平台一个 job，**直接跑 runtime 镜像**（不是在干净 alpine 里重装
#               wheel），验的是「使用者拿到的那个镜像本身」
#   4) publish：全部构建 + 全部冒烟通过、且平台集合完整，才分别合并 wheelhouse 与
#               runtime 两套 manifest，各打两个 tag
#
# 为什么冒烟跑 runtime 镜像而不重装 wheel：runtime 镜像里 numpy 是从本地 wheelhouse
# 用 `--no-index --find-links` 装的，所以它跑通就同时证明了两件事 —— wheel 在干净
# musl 环境里能装（RPATH / DT_NEEDED / .libs 自包含化正确），以及最终镜像可运行。
# 反过来在外部重装只能证明前者。
on:
  workflow_call:
    inputs:
      push:
        description: '勾选=滚动 latest 等正式标签；不勾=产出 dev 标签。两者都推产物'
        type: boolean
        default: false
      platforms:
        description: '平台子集（空 = 默认 6 平台）。子集禁止发布'
        type: string
        default: ''
      apk_mirror:
        description: 'apk 镜像源（空 = 官方源）'
        type: string
        default: ''
      alpine_version:
        description: 'alpine 版本，决定 Python 小版本与 wheel 的 cpXX tag'
        type: string
        default: '3.24'
      onnx_version:
        description: 'onnxruntime 版本（同时是 runtime 镜像的 tag）'
        type: string
        default: '1.24.4'
      numpy_version:
        description: 'numpy 版本（决定 wheelhouse 里那个 numpy wheel）'
        type: string
        default: '2.4.6'
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快一个数量级）'
        type: boolean
        default: true
      dockerfile:
        description: '用哪份 Dockerfile 构建'
        type: string
        default: 'Dockerfile'
      cache_bust:
        description: '缓存 scope 后缀。留空=复用缓存；填任意值=不复用旧层'
        type: string
        default: ''
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      # ghcr 用它；没有就用 GITHUB_TOKEN（reusable workflow 里 secrets 必须显式声明，
      # 否则 GitHub 拒绝解析整个 workflow，run 会立即失败且不产生任何 job）
      GHCR_TOKEN:
        required: false

env:
  # 产物总是推：dev 构建（dispatch 不勾 push）也要产出可拉取的镜像。
  # 「发不发布」只决定 tag 怎么命名（tag / 版本号 / dev），不再决定推不推。
  PUBLISH: 'true'
  IMAGE: docker.io/a76yyyy/onnxruntime
  # 与仓库同名：ghcr 上只保留同名 package，避免 onnxruntime / onnxruntime-docker 两份
  GHCR_IMAGE: ghcr.io/qd-today/onnxruntime-docker
  # 默认平台 = 可用平台全集。这 6 个是实测「apk 有 py3-onnxruntime + py3-numpy，
  # 且 numpy 线性代数在干净镜像里可用」的组合。
  #
  # 刻意不含：
  #   * 386 / s390x —— Alpine 官方 onnxruntime 配方 arch="all !s390x !x86"，
  #                    py3-onnxruntime 根本不存在；
  #   * arm/v6      —— armhf 分支只出 base 包，Python 绑定被 py3-flatbuffers 挡住；
  #   * loong64     —— 在列表里，但 alpine 官方没有该架构，plan 会为它注入
  #                    base_image=ghcr.io/loong64/alpine（同仓库有同版本 py3-onnxruntime）。
  # ddddocr 自己标注 386 / armv6 / s390x 不支持 OCR，填了也会在 Dockerfile 里 fail-fast。
  DEFAULT_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/loong64
  # loong64 专用基座（官方 alpine 无此架构）
  LOONG64_BASE: ghcr.io/loong64/alpine

jobs:
  plan:
    runs-on: ubuntu-latest
    name: Plan
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      wheel_matrix: ${{ steps.plan.outputs.wheel_matrix }}
      runtime_matrix: ${{ steps.plan.outputs.runtime_matrix }}
      smoke_matrix: ${{ steps.plan.outputs.smoke_matrix }}
      expected: ${{ steps.plan.outputs.expected }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Self-test CI scripts
        run: python3 .github/workflows/scripts/selftest.py
      - name: Check version consistency
        run: |
          # 版本号只有一个源头：Dockerfile 的 ARG 默认值。README 里的是它的副本，
          # 对不上就在这里失败——比等到构建完才发现文档过期早得多。
          python3 .github/workflows/scripts/check_versions.py

      - name: Compute matrices
        id: plan
        env:
          PLATFORM_INPUT: ${{ inputs.platforms }}
          NATIVE_ARM: ${{ inputs.native_arm && 'true' || 'false' }}
          ALPINE: ${{ inputs.alpine_version }}
          LOONG64_BASE: ${{ env.LOONG64_BASE }}
        run: |
          # 矩阵逻辑在 .github/workflows/scripts/plan.py，这里只负责落到 $GITHUB_OUTPUT
          set -euo pipefail
          python3 .github/workflows/scripts/plan.py > /tmp/plan.out
          echo "--- 构建矩阵 ---"
          echo "--- wheel 矩阵 ---"
          sed -n 's/^wheel_matrix=//p' /tmp/plan.out | python3 -m json.tool
          echo "--- runtime 矩阵 ---"
          sed -n 's/^runtime_matrix=//p' /tmp/plan.out | python3 -m json.tool
          echo "--- 其余 ---"
          grep -Ev '^(matrix|smoke_matrix)=' /tmp/plan.out
          cat /tmp/plan.out >> "$GITHUB_OUTPUT"

  # 第一段：重打包 wheel，产物导出成 artifact。与 pycurl-docker / ddddocr-docker 同构。
  #
  # 按平台拆 job 是硬约束（--output type=local 不支持多平台）。arm 系列都放原生 arm64：
  # 重打包不受 compat 模式影响，但装 wheel 不能在那儿做——见第二段说明。
  build-wheel:
    needs: plan
    name: Wheel ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wheel_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard - dockerfile exposes both exits
        # 双出口流水线要求 Dockerfile 同时有 `wheel` 与 `runtime` 两个 stage，
        # 缺一个时 buildx 只会报 "target stage ... could not be found"，看不懂；
        # 这里提前给出明确错误
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          for stage in wheel runtime; do
            if ! grep -qE "^FROM[[:space:]].*[[:space:]]AS[[:space:]]+${stage}[[:space:]]*$" "$DOCKERFILE"; then
              echo "::error::${DOCKERFILE} 没有 \`AS ${stage}\` 出口 stage，双出口流水线无法构建。"
              echo "::error::wheel 出口用于产出 wheelhouse 镜像，runtime 出口用于产出可运行镜像与冒烟。"
              exit 1
            fi
          done
          echo "出口 stage 齐全（wheel + runtime）"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute build args
        id: args
        # 不能直接把 BASE_IMAGE 写进 build-args：非 loong64 平台该值为空，
        # 而空的 `FROM ` 会直接报错。这里只在需要时追加这一行。
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
          ALPINE: ${{ inputs.alpine_version }}
          ONNX: ${{ inputs.onnx_version }}
          NUMPY: ${{ inputs.numpy_version }}
          APK_MIRROR: ${{ inputs.apk_mirror }}
        run: |
          set -euo pipefail
          {
            echo "build_args<<__BUILD_ARGS__"
            echo "ALPINE_VERSION=${ALPINE}"
            echo "ONNX_VERSION=${ONNX}"
            echo "NUMPY_VERSION=${NUMPY}"
            echo "APK_MIRROR=${APK_MIRROR}"
            if [ -n "${BASE_IMAGE}" ]; then
              echo "BASE_IMAGE=${BASE_IMAGE}"
            fi
            echo "__BUILD_ARGS__"
          } >> "$GITHUB_OUTPUT"
          echo "构建参数：ALPINE_VERSION=${ALPINE} ONNX_VERSION=${ONNX} NUMPY_VERSION=${NUMPY} BASE_IMAGE=${BASE_IMAGE:-（默认）}"
      - name: Build artifacts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # artifacts 出口目前只有 /wheels；两段式的第二段全靠它
          target: artifacts
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=./dist
          build-args: |
            ${{ steps.args.outputs.build_args }}
            PYTHON_HOST_PLATFORM=${{ matrix.python_host_platform }}
          provenance: false
          cache-from: type=gha,scope=onnxruntime-${{ matrix.group }}${{ inputs.cache_bust }}
          cache-to: type=gha,mode=max,scope=onnxruntime-${{ matrix.group }}${{ inputs.cache_bust }},ignore-error=true
      - name: Show artifacts
        run: |
          set -euo pipefail
          ls -l dist/wheels
          cat dist/wheels/SHA256SUMS
          echo "--- system-packages.txt ---"
          cat dist/wheels/system-packages.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.group }}
          path: dist
          retention-days: 1
          if-no-files-found: error

      - name: Report dependencies to FOSSA
        # 把构建时实测的随包原生库交给 FOSSA：auditwheel 收进 <dist>.libs/ 的那些
        # 在 lockfile 里根本不可见，而 LGPL 风险恰好都在那里。
        # 默认走 fossa analyze + dist/wheels/fossa-deps.yml，不需要 Enterprise：
        # apk 提供的库写成 referenced-dependencies，FOSSA 拿 ref 去自己的知识库查许可证
        # 和漏洞；自编库（onnxruntime/OpenBLAS/...）才由我们给许可证。
        # 没有 secret（fork PR）时脚本自行跳过，不会让 CI 变红。
        # FOSSA_PROJECT 用仓库 locator，与 qd 主项目（git+github.com/qd-today/qd）同一套命名，
        # 这样 github 扫描与这里的上传落在同一个项目里。
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
          FOSSA_MODE: analyze
          FOSSA_PROJECT: git+github.com/qd-today/onnxruntime-docker
          FOSSA_REVISION: ${{ github.ref_name }}+${{ matrix.group }}
        run: sh .github/workflows/scripts/upload-fossa.sh

  # 第二段：用第一段的产物组装 wheelhouse 与 runtime，推 digest。
  #
  # 统一跑 x86_64。arm64 runner 走内核 compat 模式时 Python 自报 linux-aarch64，
  # uv 在那装 wheel 会挂死（pycurl-docker 实测：x86_64 上两版 uv 都 1-2 秒通过，
  # arm64 runner 上两版都超时，只有 pip 能过）。
  build:
    needs: [plan, build-wheel]
    name: Runtime ${{ matrix.platform }}
    if: ${{ needs.build-wheel.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write      # 上传 Release 资产
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.runtime_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-${{ matrix.group }}
          path: ./dist
      - name: Guard - dockerfile exposes both exits
        # 双出口流水线要求 Dockerfile 同时有 `wheel` 与 `runtime` 两个 stage，
        # 缺一个时 buildx 只会报 "target stage ... could not be found"，看不懂；
        # 这里提前给出明确错误
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          for stage in wheel runtime; do
            if ! grep -qE "^FROM[[:space:]].*[[:space:]]AS[[:space:]]+${stage}[[:space:]]*$" "$DOCKERFILE"; then
              echo "::error::${DOCKERFILE} 没有 \`AS ${stage}\` 出口 stage，双出口流水线无法构建。"
              echo "::error::wheel 出口用于产出 wheelhouse 镜像，runtime 出口用于产出可运行镜像与冒烟。"
              exit 1
            fi
          done
          echo "出口 stage 齐全（wheel + runtime）"
      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_TOKEN || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute build args
        id: args
        # 不能直接把 BASE_IMAGE 写进 build-args：非 loong64 平台该值为空，
        # 而空的 `FROM ` 会直接报错。这里只在需要时追加这一行。
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
          ALPINE: ${{ inputs.alpine_version }}
          ONNX: ${{ inputs.onnx_version }}
          NUMPY: ${{ inputs.numpy_version }}
          APK_MIRROR: ${{ inputs.apk_mirror }}
        run: |
          set -euo pipefail
          {
            echo "build_args<<__BUILD_ARGS__"
            echo "ALPINE_VERSION=${ALPINE}"
            echo "ONNX_VERSION=${ONNX}"
            echo "NUMPY_VERSION=${NUMPY}"
            echo "APK_MIRROR=${APK_MIRROR}"
            if [ -n "${BASE_IMAGE}" ]; then
              echo "BASE_IMAGE=${BASE_IMAGE}"
            fi
            echo "__BUILD_ARGS__"
          } >> "$GITHUB_OUTPUT"
          echo "构建参数：ALPINE_VERSION=${ALPINE} ONNX_VERSION=${ONNX} NUMPY_VERSION=${NUMPY} BASE_IMAGE=${BASE_IMAGE:-（默认）}"
      - name: Build wheelhouse image
        id: wheelhouse
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 从产物重建 wheelhouse：不再重打包，秒级完成
          target: wheel-from-artifacts
          platforms: ${{ matrix.platform }}
          build-contexts: |
            wheelsrc=./dist
          outputs: |
            ${{ format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
            ${{ format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.GHCR_IMAGE) }}
          build-args: |
            ${{ steps.args.outputs.build_args }}
            PYTHON_HOST_PLATFORM=${{ matrix.python_host_platform }}
          provenance: false
          cache-from: type=gha,scope=onnxruntime-${{ matrix.group }}${{ inputs.cache_bust }}
          cache-to: type=gha,mode=max,scope=onnxruntime-${{ matrix.group }}-runtime${{ inputs.cache_bust }},ignore-error=true
      - name: Build runtime image
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          build-contexts: |
            wheelsrc=./dist
          outputs: |
            ${{ format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
            ${{ format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.GHCR_IMAGE) }}
          build-args: ${{ steps.args.outputs.build_args }}
          provenance: false
          cache-from: |
            type=gha,scope=onnxruntime-${{ matrix.group }}${{ inputs.cache_bust }}
            type=gha,scope=onnxruntime-${{ matrix.group }}-runtime${{ inputs.cache_bust }}
          cache-to: type=gha,mode=max,scope=onnxruntime-${{ matrix.group }}-runtime${{ inputs.cache_bust }},ignore-error=true
      - name: Export digests
        # 两个出口各一个 digest，分开目录存放，下游 publish 才能把两套 manifest 分清
        run: |
          set -eu
          mkdir -p /tmp/digests/wheelhouse /tmp/digests/runtime
          echo "${{ steps.wheelhouse.outputs.digest }}" > "/tmp/digests/wheelhouse/${{ matrix.group }}.digest"
          echo "${{ steps.runtime.outputs.digest }}" > "/tmp/digests/runtime/${{ matrix.group }}.digest"
          echo "wheelhouse ${{ matrix.group }}: $(cat "/tmp/digests/wheelhouse/${{ matrix.group }}.digest")"
          echo "runtime    ${{ matrix.group }}: $(cat "/tmp/digests/runtime/${{ matrix.group }}.digest")"
      - name: Upload wheelhouse digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-wheelhouse-${{ matrix.group }}
          path: /tmp/digests/wheelhouse/*.digest
          retention-days: 1
          if-no-files-found: error
      - name: Upload runtime digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-runtime-${{ matrix.group }}
          path: /tmp/digests/runtime/*.digest
          retention-days: 1
          if-no-files-found: error

  smoke:
    needs: [plan, build]
    name: Smoke ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # 直接跑已装好包的镜像，本机架构是秒级；QEMU 下 import numpy + 建 Session
    # 要放大十几倍，留足余量
    timeout-minutes: 90
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.smoke_matrix) }}
    steps:
      - name: Checkout
        # 冒烟脚本本体在仓库里（tests/smoke.py），挂进容器执行
        uses: actions/checkout@v4
      - name: Set up QEMU
        # 冒烟容器要按目标架构真跑（riscv64 / loong64 在 x86 runner 上全靠 binfmt）
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: env.PUBLISH != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Compute build args
        if: env.PUBLISH != 'true'
        id: args
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
          ALPINE: ${{ inputs.alpine_version }}
          ONNX: ${{ inputs.onnx_version }}
          NUMPY: ${{ inputs.numpy_version }}
          APK_MIRROR: ${{ inputs.apk_mirror }}
        run: |
          set -euo pipefail
          {
            echo "build_args<<__BUILD_ARGS__"
            echo "ALPINE_VERSION=${ALPINE}"
            echo "ONNX_VERSION=${ONNX}"
            echo "NUMPY_VERSION=${NUMPY}"
            echo "APK_MIRROR=${APK_MIRROR}"
            if [ -n "${BASE_IMAGE}" ]; then
              echo "BASE_IMAGE=${BASE_IMAGE}"
            fi
            echo "__BUILD_ARGS__"
          } >> "$GITHUB_OUTPUT"
      - name: Download runtime digest
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@v4
        with:
          name: digest-runtime-${{ matrix.group }}
          path: /tmp/digest
      - name: Fetch runtime image from registry
        if: env.PUBLISH == 'true'
        # 发布模式下验的就是 registry 里那份字节，而不是构建机上残留的临时镜像
        run: |
          set -eux
          DIGEST=$(cat /tmp/digest/*.digest)
          docker pull --platform "${{ matrix.platform }}" "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" "smoke:${{ matrix.arch }}"
          docker image inspect -f '{{.Id}}' "smoke:${{ matrix.arch }}"
      - name: Build runtime image
        if: env.PUBLISH != 'true'
        # 非发布模式没有 registry 可拉，就地按同一个 target 构建并装进本地 docker。
        # repack 阶段命中 build job 导出的 gha 缓存，不会重跑 auditwheel。
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ inputs.dockerfile }}
          target: runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: smoke:${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.build_args }}
          provenance: false
          cache-from: |
            type=gha,scope=onnx-${{ matrix.group }}${{ inputs.cache_bust }}
            type=gha,scope=onnx-${{ matrix.group }}-runtime${{ inputs.cache_bust }}
          cache-to: type=gha,mode=max,scope=onnx-${{ matrix.group }}-runtime${{ inputs.cache_bust }},ignore-error=true
      - name: Run smoke in runtime image
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.onnx_version }}
        # smoke.py 会验：环境架构、numpy 版本 + 线性代数（solve/svd/norm）、
        # onnxruntime 版本 + provider、4 个产物的 ELF 架构、一次真实推理
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "$PLATFORM" \
            -v "$PWD/tests:/tests:ro" \
            "smoke:${{ matrix.arch }}" \
            python3 /tests/smoke.py "$PLATFORM" "$VERSION"

  publish:
    needs: [plan, build, smoke]
    name: Merge digests and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 闸门（fail-closed）：① 有发布意图 ② build 与 smoke 都成功（任何一个失败/取消
    # 都不发布，也不做「部分成功就先发一半」）③ 平台集合完整（见下一步）
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.smoke.result == 'success' }}
    permissions:
      contents: write      # 上传 Release 资产
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard - reject partial publish
        if: ${{ needs.plan.outputs.full != 'true' }}
        run: |
          echo "::error::平台子集（${{ needs.plan.outputs.expected }}）不是完整平台集合，禁止发布。"
          echo "::error::用子集发布会把两套多平台 manifest 都覆盖成不完整版本。"
          echo "::error::要发布请留空 platforms 走全平台构建。"
          exit 1
      - name: Download wheelhouse digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-wheelhouse-*
          path: /tmp/digests/wheelhouse
          merge-multiple: true
      - name: Download runtime digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-runtime-*
          path: /tmp/digests/runtime
          merge-multiple: true
      - name: Guard - digest completeness
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
        # artifact 跨 job 传递，缺一个平台会静默合并出残缺 index，所以合并前按平台数核对
        run: |
          set -euo pipefail
          want=$(printf '%s' "$EXPECTED" | tr ',' '\n' | grep -c . )
          for kind in wheelhouse runtime; do
            got=$(find "/tmp/digests/$kind" -name '*.digest' | grep -c . || true)
            echo "$kind: $got / $want digest"
            if [ "$got" -ne "$want" ]; then
              echo "::error::$kind 的 digest 不完整（${got} != ${want}），禁止发布"
              exit 1
            fi
          done
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_TOKEN || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests
        env:
          VERSION: ${{ inputs.onnx_version }}
        run: |
          set -euo pipefail
          # 两个出口各自合并，绝不混在一起：wheelhouse 是 scratch + /wheels，
          # runtime 是带 python 的基座镜像，混着合会得到一个既不能跑也没有 /wheels
          # 的怪东西
          merge_one() {
            dir="$1"; shift
            SRCS=""
            GHCR_SRCS=""
            for f in "$dir"/*.digest; do
              SRCS="$SRCS ${IMAGE}@$(cat "$f")"
              GHCR_SRCS="$GHCR_SRCS ${GHCR_IMAGE}@$(cat "$f")"
            done
            echo "聚合来源 $dir:${SRCS}"
            for TAG in "$@"; do
              echo "::group::合并 -> ${IMAGE}:${TAG}"
              docker buildx imagetools create -t "${IMAGE}:${TAG}" $SRCS
              echo "::endgroup::"
              # ghcr 的 manifest 用 ghcr 自己的 digest 聚合：源与目标同 registry，
              # 不用跨 registry 复制层（ghcr 不接受来自别的 registry 的 blob 挂载）
              echo "::group::同步 -> ${GHCR_IMAGE}:${TAG}"
              docker buildx imagetools create -t "${GHCR_IMAGE}:${TAG}" $GHCR_SRCS
              echo "::endgroup::"
            done
          }

          # 标签归属与 qd 一致，两族互斥：
          #   tag 推送              -> 版本 tag + 滚动 tag（1.24.4 / latest、1.24.4-wheelhouse / wheelhouse）
          #   main 推送 / dispatch    -> 只推进 dev（dev / dev-wheelhouse）
          # latest 始终追最近一次 tag，所以只有 tag 推送能移动它。
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            RT_TAGS="${VERSION} latest"
            WH_TAGS="${VERSION}-wheelhouse wheelhouse"
          else
            RT_TAGS="dev"
            WH_TAGS="dev-wheelhouse"
          fi
          merge_one /tmp/digests/wheelhouse ${WH_TAGS}
          merge_one /tmp/digests/runtime    ${RT_TAGS}
          echo "TAGS=${WH_TAGS} ${RT_TAGS}" >> "$GITHUB_ENV"
          echo "本次产出标签：${WH_TAGS} ${RT_TAGS}"
      - name: Verify manifest platform completeness
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
        # 合并后回读 manifest：digest 数量对不等于 manifest 里平台对（历史上有过
        # 同一平台被合并两次、另一平台被吞掉的情况），所以按集合比对而不是按数量
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/verify_manifests.py
          # ghcr 上的 manifest 也要验：两个 registry 内容一致，平台集合必须相同
          IMAGE="$GHCR_IMAGE" python3 .github/workflows/scripts/verify_manifests.py

      - name: Publish wheels to GitHub Release
        # 只在 tag 推送时产出：裸 Alpine 上跑 update.sh 需要 wheel，而运行期拿不到
        # wheelhouse 镜像。资产直接从 wheelhouse 镜像里取 /wheels，不重新打包，
        # 保证与镜像里那份逐字节一致。
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORMS: ${{ needs.plan.outputs.expected }}
          # VERSION 只在那两个 step 的 env 里定义过，workflow 级没有，这里必须显式传
          VERSION: ${{ inputs.onnx_version }}
        run: |
          set -euo pipefail
          # tag 推送时 workflow_call 的 inputs 可能为空，tag 名本身就是版本号
          VERSION="${VERSION:-$(basename "${GITHUB_REF}")}"
          arch_of() {
            case "$1" in
              linux/amd64|linux/x86_64) echo x86_64 ;;
              linux/arm64)              echo aarch64 ;;
              linux/arm/v7)             echo armv7l ;;
              linux/arm/v6)             echo armv6l ;;
              linux/386)                echo i686 ;;
              linux/ppc64le)            echo ppc64le ;;
              linux/riscv64)            echo riscv64 ;;
              linux/loong64)            echo loongarch64 ;;
              *)                        echo "${1##*/}" ;;
            esac
          }
          mkdir -p /tmp/rel
          for plat in $(echo "$PLATFORMS" | tr ',' ' '); do
            arch=$(arch_of "$plat")
            echo "::group::$plat -> $arch"
            dg=$(python3 .github/workflows/scripts/wheel_digest.py "${IMAGE}:${VERSION}-wheelhouse" "$plat")
            docker pull -q "${IMAGE}"@$dg >/dev/null
            cid=$(docker create "${IMAGE}"@$dg noop)
            rm -rf "/tmp/rel/wheels-$arch"
            docker cp "$cid:/wheels" "/tmp/rel/wheels-$arch"
            docker rm -f "$cid" >/dev/null
            tar -C /tmp/rel -czf "/tmp/rel/${GITHUB_REPOSITORY#*/}-wheels-$arch.tar.gz" "wheels-$arch"
            rm -rf "/tmp/rel/wheels-$arch"
            echo "::endgroup::"
          done
          ls -lh /tmp/rel

          gh release view "${VERSION}" >/dev/null 2>&1 || \
            gh release create "${VERSION}" --title "${VERSION}" \
              --notes "Wheel 资产供裸 Alpine 部署（update.sh）使用。每个架构一个 tar.gz，内含 /wheels 的完整内容（wheel、SHA256SUMS、system-packages.txt、PEP 503 索引）。"
          gh release upload "${VERSION}" /tmp/rel/*.tar.gz --clobber
