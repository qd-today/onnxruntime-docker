# FOSSA 扫描配置（版本 3，FOSSA CLI v2）
#
# 为什么需要这个文件
# ------------------
# 仓库里的 `src/licenses/*.txt` 是**随包分发的第三方许可证全文**：Dockerfile 把
# `src/licenses` COPY 到构建阶段的 /usr/local/share/qdpack/licenses，再由
# compliance.py 按实际出现的 copyleft 挑需要的文本放进 wheelhouse 的 licenses/。
# 它们是「要交付给下游的许可证副本」，不是本仓库的代码，也不会被链接进任何产物。
#
# 但 FOSSA 的源码 license 扫描会识别纯文本里的许可证正文，把这几个文件判定为
# "本仓库包含 GPL/LGPL 代码"，在 revision f8ec21c 上产生了 3 条 licensing issue：
#   - LGPL-2.1-or-later  <- src/licenses/LGPL-2.1.txt
#   - LGPL-3.0-only      <- src/licenses/LGPL-3.0.txt
#   - GPL-3.0-only       <- src/licenses/GPL-3.0.txt
# 三条的 source 都是本仓库自身的 revision locator，而不是任何第三方依赖。
#
# 为什么 glob 要写两条
# --------------------
# FOSSA 把 `**` 定义为「匹配一个或多个目录」（见 vendored-dependencies 文档的
# Path Filtering 一节），因此 `src/licenses/**` 匹配不到直接躺在该目录下的
# `GPL-3.0.txt`。要覆盖直接文件必须另加一条 `src/licenses/*`。
# 只写 `/**` 的版本实测无效，flag 数不变。
#
# 为什么不用 paths.exclude
# ------------------------
# `paths.exclude` 作用于依赖分析（决定哪些路径参与项目识别），不影响 license
# 扫描。一开始按它写的那版完全没效果，源码 license 检测只认
# `vendoredDependencies.licenseScanPathFilters`。这里只保留确实生效的字段。
#
# 排除的影响范围
# --------------
# 仅作用于源码 license 扫描。CI 里 `upload-fossa.sh` 用 `dist/wheels/fossa-deps.yml`
# 上报的随包原生库（apk 引用 + 自编库）走另一条路径，不受本文件影响，照常上报、
# 照常产生 flag——那批才是真正需要评估的义务。
#
# 不写 project.locator：CI 通过 FOSSA_PROJECT 环境变量指定项目，避免两处打架。

version: 3

vendoredDependencies:
  licenseScanPathFilters:
    exclude:
      # 目录下的直接文件（GPL-3.0.txt / LGPL-2.1.txt / LGPL-3.0.txt）
      - "src/licenses/*"
      # 以及该目录下任意层级的文件，防止将来加入子目录
      - "src/licenses/**"
